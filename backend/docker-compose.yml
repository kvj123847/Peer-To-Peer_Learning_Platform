version: '3.9'

# ─────────────────────────────────────────────────────────────
# P2P Learning — Local Development Stack
# Usage: docker-compose up -d
# ─────────────────────────────────────────────────────────────

services:
  # ───────────────────────────────────────────────────────────
  # PostgreSQL 16 — Primary database
  # ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: p2p_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-p2p_learning}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-p2p_learning}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - p2p-learning-network

  # ───────────────────────────────────────────────────────────
  # Redis 7 — Token blacklisting & rate limiting
  # ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: p2p_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_dev_password}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis_dev_password}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - p2p-learning-network

  # ───────────────────────────────────────────────────────────
  # Adminer — Lightweight DB admin UI
  # Access at: http://localhost:8080
  #   System: PostgreSQL | Server: postgres | User: postgres
  # ───────────────────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: p2p_adminer
    restart: unless-stopped
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - p2p-learning-network

  # ───────────────────────────────────────────────────────────
  # Backend API — Built from Dockerfile.dev for hot reload
  # ───────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: p2p_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-p2p_learning}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      # Hot-reload: mount source directory
      - ./src:/app/src:ro
      # Persist node_modules inside container (avoids host override)
      - backend_node_modules:/app/node_modules
      # Persist logs
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - p2p-learning-network

# ─────────────────────────────────────────────────────────────
# Named Volumes
# ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_node_modules:
    driver: local

# ─────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────
networks:
  p2p-learning-network:
    driver: bridge
